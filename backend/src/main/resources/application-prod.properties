# Production PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/algoally}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:algoally}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:algoally_secure_pass}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
