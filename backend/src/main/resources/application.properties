spring.application.name=AlgoAllyPro-Backend
server.port=8081

# JWT Security Configuration
placementgpt.app.jwtSecret=${JWT_SECRET:algoally_pro_jwt_secure_persistent_secret_key_2026_super_secret_for_dev_only_must_be_256_bits_long_or_more}
placementgpt.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
placementgpt.app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Persistent H2 Database (Default for local development)
spring.datasource.url=jdbc:h2:file:./data/algoallydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# AI Service Configuration
algoally.ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.placementgpt=INFO
